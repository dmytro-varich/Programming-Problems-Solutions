version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restaurant_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/restaurant.db:/app/restaurant.db
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./restaurant.db
      - PROJECT_NAME=Restaurant API

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: restaurant_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1